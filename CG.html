<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro CG - Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0f0f0f; color: #fff; padding: 30px; max-width: 900px; margin: auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #ffcc00; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin: 0; }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }
        
        #status { display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #dc3545; color: white; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.4); margin-top: 10px; transition: 0.3s; }
        #status.connected { background: #28a745; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4); }

        .panel { background: linear-gradient(145deg, #1e1e1e, #252525); padding: 25px; margin-bottom: 25px; border-radius: 12px; border-left: 6px solid #ffcc00; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fff; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        input, textarea { width: 100%; padding: 15px; margin: 15px 0; box-sizing: border-box; font-size: 16px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-family: inherit; transition: 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: #ffcc00; box-shadow: 0 0 10px rgba(255, 204, 0, 0.2); }
        
        .row { display: flex; align-items: center; gap: 15px; }
        .row label { white-space: nowrap; font-weight: bold; color: #aaa; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 10px; }
        button { flex: 1; padding: 15px; border: none; cursor: pointer; font-size: 15px; font-weight: bold; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .btn-update { background: #007bff; color: white; }
        .btn-on { background: #28a745; color: white; }
        .btn-off { background: #dc3545; color: white; }
        .btn-wipe { background: linear-gradient(90deg, #ff0000, #ffcc00); color: black; font-size: 18px; padding: 20px; }
        
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.4); }
        button:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div class="header">
        <h1>PRO CG CONTROLLER</h1>
        <p>Broadcast Graphics Management System</p>
        <div id="status">Connecting to Server...</div>
    </div>

    <div class="panel">
        <h2>🔴 Top Left: LIVE Bug</h2>
        <input type="text" id="locationInput" placeholder="Enter Location Name (e.g. PUNJAB, DELHI)">
        <div class="btn-group">
            <button class="btn-update" onclick="sendCommand('updateLocation', { value: document.getElementById('locationInput').value })">Update Location</button>
            <button class="btn-on" onclick="sendCommand('toggleLive', { value: true })">Show LIVE</button>
            <button class="btn-off" onclick="sendCommand('toggleLive', { value: false })">Hide LIVE</button>
        </div>
    </div>

    <div class="panel">
        <h2>📝 Lower Third Ticker (Paging Supported)</h2>
        <div class="row">
            <label>Font Size:</label>
            <input type="number" id="fontSizeInput" value="45" style="width: 120px; margin: 0;">
            <label style="margin-left: 10px; font-size: 12px; color: #666;">(Pages automatically cycle every 5 seconds)</label>
        </div>
        <textarea id="ltInput" rows="5" placeholder="Enter line 1...&#10;Press Enter for line 2...&#10;Press Enter for line 3..."></textarea>
        <div class="btn-group">
            <button class="btn-update" onclick="updateLT()">Update Text</button>
            <button class="btn-on" onclick="sendCommand('toggleLT', { value: true })">Slide IN (Show)</button>
            <button class="btn-off" onclick="sendCommand('toggleLT', { value: false })">Slide OUT (Hide)</button>
        </div>
    </div>

    <div class="panel">
        <h2>🎬 Premium Wipe Transition</h2>
        <button class="btn-wipe" style="width: 100%;" onclick="sendCommand('triggerWipe', {})">PLAY MULTI-LAYER WIPE</button>
    </div>

    <script>
        // New Reliable HiveMQ Server
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const topic = 'yt_premium_cg_punjab_101026';

        client.on('connect', function () {
            const statusBox = document.getElementById('status');
            statusBox.innerText = "ONLINE & CONNECTED";
            statusBox.classList.add('connected');
        });

        client.on('error', function (err) {
            const statusBox = document.getElementById('status');
            statusBox.innerText = "CONNECTION ERROR!";
            statusBox.classList.remove('connected');
        });

        function sendCommand(action, dataObj) {
            dataObj.action = action;
            client.publish(topic, JSON.stringify(dataObj));
        }

        function updateLT() {
            const text = document.getElementById('ltInput').value;
            const linesArray = text.split('\n').filter(line => line.trim() !== '');
            const size = document.getElementById('fontSizeInput').value;
            
            sendCommand('updateLT', { lines: linesArray, fontSize: size });
        }
    </script>
</body>
</html>
